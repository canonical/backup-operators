name: Terraform modules release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform_modules_release.yaml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform_modules_release.yaml"

jobs:
  backup-integrator-terraform:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_release.yaml@1305365b01750a3ab472fd285ec6e1902b5377bb  # main
    permissions:
      contents: write
    with:
      tag-prefix: backup-integrator-tf-
      major-version-file: terraform/charm/backup_integrator/MAJOR_VERSION
  bacula-fd-terraform:
    needs: backup-integrator-terraform
    if: ${{ !cancelled() }}
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_release.yaml@1305365b01750a3ab472fd285ec6e1902b5377bb  # main
    permissions:
      contents: write
    with:
      tag-prefix: bacula-fd-tf-
      major-version-file: terraform/charm/bacula_fd/MAJOR_VERSION
  bacula-server-terraform:
    needs: bacula-fd-terraform
    if: ${{ !cancelled() }}
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_release.yaml@1305365b01750a3ab472fd285ec6e1902b5377bb  # main
    permissions:
      contents: write
    with:
      tag-prefix: bacula-server-tf-
      major-version-file: terraform/charm/bacula_server/MAJOR_VERSION
  backup-server-terraform:
    needs: bacula-server-terraform
    if: ${{ !cancelled() }}
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_release.yaml@1305365b01750a3ab472fd285ec6e1902b5377bb  # main
    permissions:
      contents: write
    with:
      tag-prefix: backup-server-tf-
      major-version-file: terraform/product/MAJOR_VERSION
